# yaml-language-server: $schema=ai.yaml.json

# gpt-5.2 is the same chat model the earlier labs use, so the workshop only ever
# consumes one chat-model quota per region. Check availability before changing it:
# az cognitiveservices account list-models --name <aoai-resource> -g <rg>
deployments:
  - name: gpt-5.2
    model:
      format: OpenAI
      name: gpt-5.2
      version: "2025-12-11"
    sku:
      name: GlobalStandard
      capacity: 20
  - name: text-embedding-ada-002
    model:
      format: OpenAI
      name: text-embedding-ada-002
      version: "2"
    sku:
      name: "Standard"
      capacity: 20