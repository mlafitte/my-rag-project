# yaml-language-server: $schema=ai.yaml.json

# PLACEHOLDER: "name"/"version" below are not verified against a real subscription.
# Before running azd provision, replace with a GPT-5-class chat model/version your
# subscription+region can actually deploy (check with:
# az cognitiveservices account list-models --name <aoai-resource> -g <rg> ).
deployments:
  - name: gpt-5
    model:
      format: OpenAI
      name: gpt-5
      version: "2025-08-07"
    sku:
      name: GlobalStandard
      capacity: 20
  - name: text-embedding-ada-002
    model:
      format: OpenAI
      name: text-embedding-ada-002
      version: "2"
    sku:
      name: "Standard"
      capacity: 20